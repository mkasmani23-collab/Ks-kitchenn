name: Build K's Kitchen APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Build APK
        run: |
          unzip -q "KsKitchenCloudBuild-ready (1).zip"
          sed -i 's#<string name="app_name".*#<string name="app_name">Ks Kitchen</string>#' KsKitchenAndroid/app/src/main/res/values/themes.xml
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          cd KsKitchenAndroid
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Ks-Kitchen.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ks-Kitchen-APK
          path: Ks-Kitchen.apk 
